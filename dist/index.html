<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#154f43" />
    <meta
      name="description"
      content="حدد سعراتك وبروتينك وكربوهيدراتك، واحصل على كميات طعام ليوم كامل بحسابات موثقة."
    />
    <title>برنامجي الغذائي</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23154f43'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23dbf49a' stroke-width='2'/%3E%3Cpath d='m11 16 3 3 7-7' fill='none' stroke='%23dbf49a' stroke-width='2'/%3E%3C/svg%3E"
    />
    <link
      rel="preload"
      href="assets/fonts/noto-naskh-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/noto-sans-extrabold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="style.css?v=review1" />
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="./" aria-label="برنامجي الغذائي، البداية"
          ><span class="brand-icon">◉</span> برنامجي الغذائي</a
        ><span class="header-note">يومك، على مقاس هدفك</span>
      </header>
      <section id="start">
        <div class="eyebrow">خطة بسيطة ليوم واحد</div>
        <h1>حدد هدفك<br /><span>اليومي.</span></h1>
        <p class="intro">أنت تحدد الهدف، ونحن نحسب كميات الطعام.</p>
        <form id="targets">
          <label class="input-card"
            ><span>السعرات الحرارية</span>
            <div>
              <input
                id="calories"
                name="calories"
                type="number"
                inputmode="decimal"
                min="1"
                max="10000"
                step="any"
                placeholder="1800"
                required
                aria-label="السعرات الحرارية"
              /><span>سعرة</span>
            </div></label
          >
          <div class="macro-inputs">
            <label class="input-card"
              ><span><i class="dot protein"></i> البروتين</span>
              <div>
                <input
                  id="protein"
                  name="protein"
                  type="number"
                  inputmode="decimal"
                  min="0"
                  max="1000"
                  step="any"
                  placeholder="150"
                  required
                  aria-label="البروتين"
                /><span>جم</span>
              </div></label
            ><label class="input-card"
              ><span><i class="dot carbs"></i> الكربوهيدرات</span>
              <div>
                <input
                  id="carbs"
                  name="carbs"
                  type="number"
                  inputmode="decimal"
                  min="0"
                  max="2000"
                  step="any"
                  placeholder="170"
                  required
                  aria-label="الكربوهيدرات"
                /><span>جم</span>
              </div></label
            >
          </div>
          <label class="input-card meal-count-card" for="mealCount"
            ><span>عدد الوجبات في اليوم</span
            ><select
              id="mealCount"
              name="mealCount"
              aria-label="عدد الوجبات في اليوم"
            >
              <option value="2">وجبتان</option>
              <option value="3" selected>٣ وجبات</option>
              <option value="4">٤ وجبات</option>
              <option value="5">٥ وجبات</option>
              <option value="6">٦ وجبات</option></select
            ><small>يشمل الوجبات الرئيسية والخفيفة</small></label
          >
          <p id="error" role="alert" hidden></p>
          <button class="primary" type="submit">
            أنشئ برنامجي الغذائي <span>←</span>
          </button>
        </form>
        <div class="quiet-note">وجبات متناسقة · كميات عملية · حسابات واضحة</div>
      </section>
      <section id="results" hidden aria-live="polite"></section>
      <footer>
        <span>حاسبة لتوزيع الطعام، وليست توصية بأهدافك.</span>
        <details id="sources">
          <summary>المصادر وطريقة الحساب</summary>
          <div id="source-content">
            نعتمد القيم الغذائية الموثقة والحساب بعد تقريب الكميات.
          </div>
        </details>
      </footer>
    </main>
    <script type="module" src="ui.js?v=review1"></script>
  </body>
</html>
